name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels an older one still in progress.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Public NEXT_PUBLIC_* values come from the committed .env.production.
      # Server secrets live in the Worker itself (wrangler secret), not here.
      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 91db861cf9a54e287c59674d23d7eb42

      - name: Smoke test
        run: |
          for path in / /services /portfolio /blog /admin/login; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://signatureworks.com.bd$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
